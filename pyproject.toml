    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.6",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "langgraph>=1.0",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "streamlit-flow-component>=1.6.1",
    "tomlkit>=0.15.2",
